<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dead Legs — WNBA rest &amp; travel</title>
<style>
  :root{
    --bg:#0c0b0e; --surface:#161419; --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.11);
    --text:#f4f2f0; --dim:#9b98a3; --faint:#66646e;
    --hot:#ff6a45; --cool:#3fe0c5;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-text-size-adjust:100%}
  body{max-width:760px;margin:0 auto;padding:0 20px 90px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
  ::selection{background:rgba(255,106,69,.25)}

  header{padding:30px 0 16px}
  .mark{font-size:33px;font-weight:800;letter-spacing:-.035em;line-height:1}
  .mark .d{color:var(--hot)}
  .tag{color:var(--dim);font-size:13.5px;margin-top:9px;letter-spacing:-.01em}
  .stateline{color:var(--faint);font-size:11px;margin-top:18px;display:flex;gap:9px;align-items:center;letter-spacing:.02em}
  .stateline b{color:var(--dim);font-weight:600}
  .rf{margin-left:auto;color:var(--dim);background:none;border:1px solid var(--line2);border-radius:20px;font-family:inherit;font-size:11px;cursor:pointer;padding:5px 13px;letter-spacing:.03em}
  .rf:active{transform:translateY(1px)}

  nav{display:flex;gap:8px;align-items:center;padding:6px 0 14px;flex-wrap:wrap;position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 80%,transparent);z-index:5}
  .tab{background:none;border:0;color:var(--faint);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:7px 13px;border-radius:9px;letter-spacing:-.01em}
  .tab.on{color:var(--text);background:var(--surface)}
  nav .grow{flex:1}
  select{background:var(--surface);color:var(--text);border:1px solid var(--line2);border-radius:9px;padding:7px 11px;font-family:inherit;font-size:13px;font-weight:500}
  .mmtoggle{background:none;border:1px solid var(--line2);color:var(--faint);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:7px 13px;border-radius:9px;letter-spacing:.02em}
  .mmtoggle.on{color:var(--hot);border-color:rgba(255,106,69,.42);background:rgba(255,106,69,.09)}

  .msg{padding:44px 4px;color:var(--dim);font-size:14px;line-height:1.7}
  .msg b{color:var(--text)} .msg code{color:var(--hot);font-size:12px;word-break:break-all}

  /* shared labeled readout */
  .lbl{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
  .readout{display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:12px}
  .stat{display:inline-flex;flex-direction:column;gap:4px}
  .stat .val{font-size:13.5px;font-weight:600;color:var(--text);letter-spacing:-.005em}
  .stat .val.hot{color:var(--hot)} .stat .val.cool{color:var(--cool)}

  /* slate */
  .daygroup{margin-top:28px}
  .dayhead{font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
  .game{padding:16px 0 17px;border-top:1px solid var(--line)}
  .game.hot{border-top-color:rgba(255,106,69,.3)}
  .matchup{font-size:20px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
  .matchup .tm.hot{color:var(--hot)} .matchup .tm.cool{color:var(--cool)}
  .matchup .at{color:var(--faint);font-weight:500;font-size:14px;padding:0 8px}

  /* team focus */
  .tf-top{padding:22px 0 4px}
  .tf-name{font-size:30px;font-weight:800;letter-spacing:-.03em}
  .tf-sub{color:var(--dim);font-size:13px;margin-top:6px;font-weight:500}
  .tf-stats{display:flex;gap:32px;margin-top:20px;padding-bottom:4px}
  .tf-stats .val{font-size:23px;font-weight:750;letter-spacing:-.025em;display:block;margin-bottom:4px;color:var(--text)}
  .leg{padding:15px 0 16px;border-top:1px solid var(--line)}
  .leg.hot{border-top-color:rgba(255,106,69,.3)}
  .leg-head{display:flex;align-items:baseline;gap:10px}
  .leg-head .dt{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .leg.hot .leg-head .dt{color:var(--hot)}
  .leg-head .opp{font-size:14px;color:var(--dim);font-weight:500}
  .leg-head .opp .at{color:var(--faint)}

  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:11px;line-height:1.65}
</style>
</head>
<body>
<header>
  <div class="mark">Dead Legs<span class="d">.</span></div>
  <div class="tag">WNBA 2026 — who's tired, who's fresh, who just got off a plane.</div>
  <div class="stateline"><span id="statusText">Loading…</span><span id="updated"></span><button class="rf" id="refresh">Refresh</button></div>
</header>

<nav>
  <button class="tab on" id="vLeague">Slate</button>
  <button class="tab" id="vTeam">By team</button>
  <span class="grow"></span>
  <select id="teamSel" style="display:none"></select>
  <select id="rangeSel">
    <option value="next">Next 3 weeks</option>
    <option value="week">Next 7 days</option>
    <option value="all">Full season</option>
  </select>
  <button class="mmtoggle" id="onlyEdge">Mismatches</button>
</nav>

<div id="app"><div class="msg">Loading the 2026 schedule…</div></div>

<footer id="foot"></footer>

<script>
/* ---------- team reference (keyed by nickname; matched at runtime) ---------- */
const TEAMS = {
  Dream:{city:"Atlanta",lat:33.749,lng:-84.388,off:-4,tz:"ET"},
  Sky:{city:"Chicago",lat:41.878,lng:-87.629,off:-5,tz:"CT"},
  Sun:{city:"Uncasville",lat:41.490,lng:-72.093,off:-4,tz:"ET"},
  Wings:{city:"Arlington",lat:32.735,lng:-97.108,off:-5,tz:"CT"},
  Valkyries:{city:"San Francisco",lat:37.768,lng:-122.388,off:-7,tz:"PT"},
  Fever:{city:"Indianapolis",lat:39.764,lng:-86.155,off:-4,tz:"ET"},
  Aces:{city:"Las Vegas",lat:36.090,lng:-115.176,off:-7,tz:"PT"},
  Sparks:{city:"Los Angeles",lat:34.043,lng:-118.267,off:-7,tz:"PT"},
  Lynx:{city:"Minneapolis",lat:44.979,lng:-93.276,off:-5,tz:"CT"},
  Liberty:{city:"Brooklyn",lat:40.683,lng:-73.976,off:-4,tz:"ET"},
  Mercury:{city:"Phoenix",lat:33.446,lng:-112.071,off:-7,tz:"MST"},
  Storm:{city:"Seattle",lat:47.622,lng:-122.354,off:-7,tz:"PT"},
  Mystics:{city:"Washington",lat:38.865,lng:-76.978,off:-4,tz:"ET"},
  Tempo:{city:"Toronto",lat:43.634,lng:-79.416,off:-4,tz:"ET"},
  Fire:{city:"Portland",lat:45.532,lng:-122.667,off:-7,tz:"PT"}
};
const NICKS = Object.keys(TEAMS);
function nickFrom(str){ if(!str) return null; for(const n of NICKS){ if(str.includes(n)) return n; } return null; }
const HAUL_MI=1500, LONG_MI=1000;
const CACHE_KEY="wnba_logistics_2026_v2", TTL=12*3600*1000;
const BASE="https://site.api.espn.com/apis/site/v2/sports/basketball/wnba";

/* ---------- helpers ---------- */
function haversine(a,b){
  const R=3958.8, tr=Math.PI/180;
  const dLat=(b.lat-a.lat)*tr, dLng=(b.lng-a.lng)*tr;
  const s=Math.sin(dLat/2)**2+Math.cos(a.lat*tr)*Math.cos(b.lat*tr)*Math.sin(dLng/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(s)));
}
function dayNum(iso){ const d=new Date(iso); return Math.floor(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())/86400000); }
function fmtDate(iso){ return new Date(iso).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }
function dayKey(iso){ return new Date(iso).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}); }

/* ---------- fetch: optional self-host relay, then direct, then public relays ---------- */
/* PERMANENT FIX: deploy the tiny Cloudflare Worker (steps in chat) and paste its URL below, ending in ?url= */
const MY_PROXY=""; // e.g. "https://deadlegs.yourname.workers.dev/?url="
const PUBLIC=[
  u=>u,                                                            // direct (works only if ESPN ever adds CORS)
  u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),  // ~20/min
  u=>"https://api.codetabs.com/v1/proxy/?quest="+encodeURIComponent(u),
  u=>"https://proxy.killcors.com/?url="+encodeURIComponent(u),
  u=>"https://cors.x2u.in/"+u
];
const PROXIES = MY_PROXY ? [u=>MY_PROXY+encodeURIComponent(u), ...PUBLIC] : PUBLIC;
let PROXY_MODE=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function tryFetch(url){ const r=await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status); return JSON.parse(await r.text()); }
async function getJSON(url){
  const idx=[...PROXIES.keys()];
  const order = PROXY_MODE!==null ? [PROXY_MODE,...idx].filter((v,i,a)=>a.indexOf(v)===i) : idx;
  let lastErr;
  for(const i of order){
    try{ const j=await tryFetch(PROXIES[i](url)); PROXY_MODE=i; return j; }
    catch(e){ lastErr=e; }
  }
  throw lastErr||new Error("all relays failed");
}
async function loadSchedule(force){
  const cached=safeCache();
  if(!force && cached) return cached;
  setStatus("Finding teams…");
  const td=await getJSON(BASE+"/teams");
  const list=(((td.sports||[])[0]||{}).leagues||[])[0]?.teams||[];
  const ids=[];
  for(const t of list){ const T=t.team||{}; const nk=nickFrom(T.displayName)||nickFrom(T.name)||nickFrom(T.shortDisplayName)||nickFrom(T.location); if(nk&&T.id) ids.push({id:T.id,nick:nk}); }
  if(!ids.length) throw new Error("No teams matched reference table");
  const seen={},games=[]; let done=0;
  for(const {id} of ids){
    setStatus("Loading schedules "+(++done)+"/"+ids.length);
    let sd; try{ sd=await getJSON(BASE+"/teams/"+id+"/schedule"); }catch(e){ continue; }
    if(PROXY_MODE>0 && !MY_PROXY) await sleep(250);
    for(const ev of (sd.events||[])){
      if(seen[ev.id]) continue;
      const comp=(ev.competitions||[])[0]; if(!comp) continue;
      const st=ev.seasonType ?? (ev.season&&ev.season.type) ?? null; if(st===1) continue;
      const cs=comp.competitors||[]; if(cs.length<2) continue;
      let home=null,away=null;
      for(const c of cs){ const nk=nickFrom((c.team||{}).displayName)||nickFrom((c.team||{}).name)||nickFrom((c.team||{}).location); if(!nk) continue; if(c.homeAway==="home") home=nk; else if(c.homeAway==="away") away=nk; }
      if(!home||!away||!TEAMS[home]||!TEAMS[away]) continue;
      seen[ev.id]=1; games.push({id:ev.id,date:ev.date,home,away});
    }
  }
  games.sort((a,b)=>new Date(a.date)-new Date(b.date));
  const payload={games,ts:Date.now()};
  try{ localStorage.setItem(CACHE_KEY,JSON.stringify(payload)); }catch(e){}
  return payload;
}
function safeCache(){ try{ const raw=localStorage.getItem(CACHE_KEY); if(!raw) return null; const p=JSON.parse(raw); if(!p.games||!p.games.length) return null; if(Date.now()-p.ts>TTL) return {...p,stale:true}; return p; }catch(e){ return null; } }

/* ---------- compute legs ---------- */
function buildLegs(games){
  const byTeam={}; for(const n of NICKS) byTeam[n]=[];
  for(const g of games){ byTeam[g.home].push({g,side:"home",cityNick:g.home,opp:g.away}); byTeam[g.away].push({g,side:"away",cityNick:g.home,opp:g.home}); }
  const legIndex={};
  for(const n of NICKS){
    const legs=byTeam[n].sort((a,b)=>new Date(a.g.date)-new Date(b.g.date));
    const dayList=legs.map(l=>dayNum(l.g.date));
    let prevCity=n, prevDay=null;
    legs.forEach((l,i)=>{
      const dn=dayList[i];
      const rest=prevDay===null?null:(dn-prevDay-1);
      const miles=haversine(TEAMS[prevCity],TEAMS[l.cityNick]);
      const tz=Math.abs(TEAMS[prevCity].off-TEAMS[l.cityNick].off);
      const eastward=TEAMS[l.cityNick].off>TEAMS[prevCity].off;
      let in4=0,in6=0; for(let j=0;j<=i;j++){ const d=dayList[j]; if(dn-d<4) in4++; if(dn-d<6) in6++; }
      const b2b=rest===0, haul=miles>=HAUL_MI;
      let sev=0;
      if(b2b) sev+=3;
      if(in4>=3) sev+=2;
      if(tz>0) sev += eastward ? tz : tz*0.5;
      if(haul && (b2b||in4>=3)) sev+=1;
      const s={rest,miles,tz,eastward,b2b,haul,in4,in6,sev,side:l.side,opp:l.opp};
      l.stats=s; legIndex[l.g.id]=legIndex[l.g.id]||{}; legIndex[l.g.id][l.side]=s;
      prevCity=l.cityNick; prevDay=dn;
    });
  }
  return {byTeam,legIndex};
}

/* ---------- one plain-English fatigue phrase ---------- */
function phrase(s){
  if(!s) return "";
  if(s.b2b && s.haul) return "back-to-back off a flight";
  if(s.b2b) return "back-to-back";
  if(s.in4>=3) return "3 games in 4 nights";
  if(s.haul) return "cross-country trip";
  if(s.tz>=2) return (s.eastward?"eastbound ":"")+"3-zone trip";
  if(s.miles>=LONG_MI) return "long trip in";
  if(s.in6>=4) return "4 games in 6 nights";
  return "";
}
function isTired(s){ return s && phrase(s)!==""; }

/* ---------- state + render ---------- */
const app=document.getElementById("app");
let STATE={view:"league",team:null,range:"next",onlyEdge:true,data:null,legs:null};

function inRange(iso){
  const today=dayNum(new Date().toISOString()), d=dayNum(iso);
  if(STATE.range==="week") return d>=today && d<=today+7;
  if(STATE.range==="next") return d>=today && d<=today+21;
  return true;
}

function restWord(r){ return r===null?'opener':r===0?'0 days':r+(r===1?' day':' days'); }
function zoneWord(s){ return s.tz?((s.eastward?'east ':'west ')+s.tz):'same'; }
function statHTML(a){ return '<div class="readout">'+a.map(s=>'<span class="stat"><span class="lbl">'+s.l+'</span><span class="val '+(s.c||'')+'">'+s.v+'</span></span>').join('')+'</div>'; }

function heatWord(sev){ return sev>=5?'brutal':sev>=3?'rough':sev>=1?'mild':''; }

function gameCard(it, ranked){
  const {g,hs,as,ht,at}=it;
  const hr=hs?hs.rest:null, ar=as?as.rest:null;
  const awayCool=!at&&ht&&ar!==null&&ar>=2, homeCool=!ht&&at&&hr!==null&&hr>=2;
  const awayCls=at?'hot':(awayCool?'cool':''), homeCls=ht?'hot':(homeCool?'cool':'');
  const stats=[];
  if(hr!==null&&ar!==null&&hr!==ar){ const who=hr>ar?g.home:g.away; stats.push({l:'rest edge',v:who+' +'+Math.abs(hr-ar),c:'cool'}); }
  if(at) stats.push({l:g.away,v:phrase(as)+' · '+restWord(as.rest),c:'hot'});
  if(ht) stats.push({l:g.home,v:phrase(hs)+' · '+restWord(hs.rest),c:'hot'});
  const trav=Math.max(at&&as?as.miles:0, ht&&hs?hs.miles:0);
  if(trav>=700) stats.push({l:'travel',v:trav.toLocaleString()+' mi',c:''});
  let meta='';
  if(ranked){ const sev=(at?as:hs).sev, hw=heatWord(sev); meta='<div class="gmeta"><span class="when">'+fmtDate(g.date)+'</span>'+(hw?'<span class="heat">'+hw+'</span>':'')+'</div>'; }
  return '<div class="game'+((ht||at)?' hot':'')+'">'+meta
    +'<div class="matchup"><span class="tm '+awayCls+'">'+g.away+'</span><span class="at">at</span><span class="tm '+homeCls+'">'+g.home+'</span></div>'
    +(stats.length?statHTML(stats):'')+'</div>';
}

function renderLeague(){
  const {games}=STATE.data, {legIndex}=STATE.legs;
  const rows=games.filter(g=>inRange(g.date));
  if(!rows.length){ app.innerHTML='<div class="msg">Nothing in this window. Try full season.</div>'; return; }
  if(STATE.onlyEdge){
    const list=[];
    for(const g of rows){
      const li=legIndex[g.id]||{}, hs=li.home, as=li.away;
      const ht=isTired(hs), at=isTired(as);
      if(!((ht||at)&&!(ht&&at))) continue;
      list.push({g,hs,as,ht,at,sev:(at?as:hs).sev});
    }
    if(!list.length){ app.innerHTML='<div class="msg">No lopsided rest spots in this window — every game is roughly even. Widen the range, or turn off Mismatches for the full slate.</div>'; return; }
    list.sort((x,y)=> y.sev-x.sev || new Date(x.g.date)-new Date(y.g.date));
    app.innerHTML='<div class="dayhead" style="margin:24px 0 2px">worst edges first</div>'+list.map(it=>gameCard(it,true)).join('');
    return;
  }
  let html="", curDay="", open=false;
  for(const g of rows){
    const li=legIndex[g.id]||{}, hs=li.home, as=li.away;
    const ht=isTired(hs), at=isTired(as);
    const dk=dayKey(g.date);
    if(dk!==curDay){ if(open) html+='</div>'; curDay=dk; html+='<div class="daygroup"><div class="dayhead">'+dk+'</div>'; open=true; }
    html+=gameCard({g,hs,as,ht,at},false);
  }
  if(open) html+='</div>';
  app.innerHTML=html;
}

function renderTeam(){
  const nk=STATE.team, legs=STATE.legs.byTeam[nk]||[];
  const rows=legs.filter(l=>inRange(l.g.date));
  const totMiles=legs.reduce((s,l)=>s+(l.stats.miles||0),0);
  const b2bs=legs.filter(l=>l.stats.b2b).length;
  const longest=legs.reduce((m,l)=>Math.max(m,l.stats.miles||0),0);
  let html='<div class="tf-top"><div class="tf-name">'+nk+'</div>'
    +'<div class="tf-sub">'+TEAMS[nk].city+' · '+TEAMS[nk].tz+' · '+legs.length+' games</div>'
    +'<div class="tf-stats">'
    +'<span class="stat"><span class="val">'+totMiles.toLocaleString()+'</span><span class="lbl">season miles</span></span>'
    +'<span class="stat"><span class="val">'+b2bs+'</span><span class="lbl">back-to-backs</span></span>'
    +'<span class="stat"><span class="val">'+longest.toLocaleString()+'</span><span class="lbl">longest trip</span></span>'
    +'</div></div>';
  if(!rows.length){ html+='<div class="msg">Nothing in this window.</div>'; app.innerHTML=html; return; }
  for(const l of rows){
    const s=l.stats, tired=isTired(s);
    const stats=[
      {l:'rest',v:restWord(s.rest),c:s.b2b?'hot':''},
      {l:'travel',v:s.miles.toLocaleString()+' mi',c:''},
      {l:'zones',v:zoneWord(s),c:''}
    ];
    if(tired) stats.push({l:'flag',v:phrase(s),c:'hot'});
    html+='<div class="leg'+(tired?' hot':'')+'">'
      +'<div class="leg-head"><span class="dt">'+fmtDate(l.g.date)+'</span><span class="opp"><span class="at">'+(s.side==="home"?"vs":"at")+'</span> '+s.opp+'</span></div>'
      +statHTML(stats)+'</div>';
  }
  app.innerHTML=html;
}
function render(){ if(!STATE.data) return; if(STATE.view==="team"&&STATE.team) renderTeam(); else renderLeague(); }

/* ---------- status ---------- */
function setStatus(t){ document.getElementById("statusText").textContent=t; }
function setUpdated(ts,stale){ const el=document.getElementById("updated"); el.textContent=ts?('· '+new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+(stale?' (stale)':'')):''; }

async function boot(force){
  try{
    setStatus("Loading…");
    const data=await loadSchedule(force);
    STATE.data=data; STATE.legs=buildLegs(data.games);
    setStatus(data.games.length+" games"+(PROXY_MODE>0?" · via proxy":""));
    setUpdated(data.ts,data.stale);
    document.getElementById("foot").textContent="Rest = days between a team's games. Travel = miles between arena cities; openers start at home. Time zones use summer offsets (Phoenix reads Pacific in-season). Everything here is schedule fact — not a prediction.";
    render();
  }catch(e){
    setStatus("offline");
    app.innerHTML='<div class="msg"><b>Couldn\'t load the schedule.</b> Tried ESPN direct plus four public relays and all failed just now — the free relays throttle or go down. Tap <b>refresh</b> to retry, or set up your own relay (I sent 4 quick steps in chat) for a permanent fix. <br><br>Last error: <code>'+(e.message||e)+'</code></div>';
  }
}

/* ---------- wiring ---------- */
const teamSel=document.getElementById("teamSel");
NICKS.slice().sort().forEach(n=>{ const o=document.createElement("option"); o.value=n; o.textContent=n; teamSel.appendChild(o); });
STATE.team=teamSel.value=NICKS.slice().sort()[0];
teamSel.onchange=()=>{ STATE.team=teamSel.value; render(); };

const vL=document.getElementById("vLeague"), vT=document.getElementById("vTeam"), oe=document.getElementById("onlyEdge");
function setView(v){
  STATE.view=v; vL.classList.toggle("on",v==="league"); vT.classList.toggle("on",v==="team");
  teamSel.style.display=v==="team"?"inline-block":"none";
  oe.style.display=v==="league"?"inline-block":"none";
  render();
}
oe.classList.toggle("on",STATE.onlyEdge);
vL.onclick=()=>setView("league"); vT.onclick=()=>setView("team");
document.getElementById("rangeSel").onchange=e=>{ STATE.range=e.target.value; render(); };
oe.onclick=()=>{ STATE.onlyEdge=!STATE.onlyEdge; oe.classList.toggle("on",STATE.onlyEdge); render(); };
document.getElementById("refresh").onclick=()=>boot(true);

boot(false);
</script>
</body>
</html>
